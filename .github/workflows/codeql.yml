name: SAST - CodeQL

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  schedule:
    - cron: "17 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  privacy-remediation:
    name: Semgrep privacy remediation and rescan
    runs-on: ubuntu-latest

    steps:
      - name: Checkout full history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Materialize pre-remediation source
        run: |
          mkdir -p sast-evidence/before
          git show f397240:backend/api/feed_handler.go > sast-evidence/before/feed_handler.go

      - name: Scan historical source with privacy rule
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.130.0 \
            semgrep scan --config .semgrep/privacy.yml --no-git-ignore --json \
            --output sast-evidence/semgrep-before.json sast-evidence/before \
            || test -s sast-evidence/semgrep-before.json

      - name: Rescan current source with the same rule
        run: |
          docker run --rm -v "$PWD:/src" -w /src semgrep/semgrep:1.130.0 \
            semgrep scan --config .semgrep/privacy.yml --json \
            --output sast-evidence/semgrep-after.json backend

      - name: Enforce finding-to-fix evidence
        run: |
          before_errors="$(jq '.errors | length' sast-evidence/semgrep-before.json)"
          after_errors="$(jq '.errors | length' sast-evidence/semgrep-after.json)"
          before_count="$(jq '.results | length' sast-evidence/semgrep-before.json)"
          after_count="$(jq '.results | length' sast-evidence/semgrep-after.json)"
          test "$before_errors" -eq 0
          test "$after_errors" -eq 0
          test "$before_count" -eq 1
          test "$after_count" -eq 0
          printf 'Historical findings: %s\nCurrent findings: %s\n' \
            "$before_count" "$after_count" | tee sast-evidence/remediation-summary.txt

      - name: Upload SAST remediation evidence
        uses: actions/upload-artifact@v7
        with:
          name: semgrep-sast-remediation
          path: |
            sast-evidence/semgrep-before.json
            sast-evidence/semgrep-after.json
            sast-evidence/remediation-summary.txt

  analyze:
    name: Analyze ${{ matrix.language }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: go
            build-mode: autobuild
          - language: java-kotlin
            build-mode: manual

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          build-mode: ${{ matrix.build-mode }}

      - name: Autobuild Go
        if: matrix.language == 'go'
        uses: github/codeql-action/autobuild@v4

      - name: Set up JDK 17
        if: matrix.language == 'java-kotlin'
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Build Android for analysis
        if: matrix.language == 'java-kotlin'
        working-directory: ToutiaoAndroid
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Analyze
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}"
