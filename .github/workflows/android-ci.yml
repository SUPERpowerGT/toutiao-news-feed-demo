name: Android CI

on:
  push:
    branches:
      - main
      - master
      - "feature/*"    # ← 让所有 feature 分支也触发 CI
  pull_request:
    branches:
      - main
      - master


jobs:
  android-build:
    runs-on: ubuntu-latest

    # ⭐ 所有 run 脚本默认在 ToutiaoAndroid 目录里执行
    defaults:
      run:
        working-directory: ToutiaoAndroid

    steps:
      # 1. 拉取代码
      - name: Checkout
        uses: actions/checkout@v4

      # 2. 配好 JDK 17（你的 Compose/AGP 基本都要求 17 了）
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      # 3. 缓存 Gradle，加快后面构建速度（可选但推荐）
      - name: Cache Gradle
        uses: actions/cache@v3
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: ${{ runner.os }}-gradle-${{ hashFiles('**/*.gradle*', '**/gradle.properties', '**/libs.versions.toml') }}
          restore-keys: |
             ${{ runner.os }}-gradle-


      # 4. 让 gradlew 可执行（Linux 上必须要这一步）
      - name: Make gradlew executable
        run: chmod +x gradlew

      # 5. 跑单元测试（包括你刚写的 FeedViewModelTest）
      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      # 6. 编译 Debug APK
      - name: Build Debug APK
        run: ./gradlew assembleDebug

      # 7. 把编译好的 APK 作为构建产物上传（以后可以网页一键下载）
      - name: Upload APK
        uses: actions/upload-artifact@v3
        with:
          name: app-debug.apk
          # 注意：这里是相对于仓库根目录的路径，所以需要加 ToutiaoAndroid/
          path: ToutiaoAndroid/app/build/outputs/apk/debug/app-debug.apk
