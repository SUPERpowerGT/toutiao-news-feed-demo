name: Dependency and Container Security

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  security-events: write

jobs:
  filesystem-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Scan repository dependencies and secrets
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: sarif
          output: trivy-fs.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Upload filesystem scan to code scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-fs.sarif
          category: trivy-filesystem

      - name: Upload filesystem scan artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trivy-filesystem-report
          path: trivy-fs.sarif

      - name: Enforce filesystem security gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,misconfig
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"

  image-scan:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build backend image
        run: docker build --tag toutiao-backend:security backend

      - name: Scan backend image
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: toutiao-backend:security
          format: sarif
          output: trivy-image.sarif
          severity: HIGH,CRITICAL
          ignore-unfixed: true

      - name: Upload image scan to code scanning
        uses: github/codeql-action/upload-sarif@v4
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy-container-image

      - name: Upload image scan artifact
        uses: actions/upload-artifact@v7
        if: always()
        with:
          name: trivy-image-report
          path: trivy-image.sarif

      - name: Enforce image security gate
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: toutiao-backend:security
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "1"
