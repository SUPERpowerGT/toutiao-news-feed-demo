services:
  db:
    image: postgres:16
    container_name: toutiao-postgres-dev
    restart: unless-stopped

    environment:
      POSTGRES_USER: toutiao
      POSTGRES_PASSWORD: toutiao
      POSTGRES_DB: toutiao

    ports:
      - "54320:5432"   # 开发环境 DB 端口

    volumes:
      - ./docker/db/data:/var/lib/postgresql/data
      - ./docker/db/init:/docker-entrypoint-initdb.d

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U toutiao -d toutiao"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 5s

    networks:
      - toutiao_net

  backend:
    build: ./backend
    container_name: toutiao-backend-dev
    restart: unless-stopped
    profiles:
      - fullstack
    depends_on:
      db:
        condition: service_healthy
    environment:
      DB_HOST: db
      DB_PORT: 5432
      DB_USER: toutiao
      DB_PASSWORD: toutiao
      DB_NAME: toutiao
    ports:
      - "8080:8080"
    networks:
      - toutiao_net

networks:
  toutiao_net:
    driver: bridge
